<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마블 레이스</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#111}
  #ctrls{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5;transition:opacity .4s}
  #ctrls.idle{opacity:0}
  #ctrls button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
  #ctrls button:hover{background:rgba(255,255,255,.35)}
  #toast{position:fixed;left:50%;bottom:calc(14% + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:6;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}
  body.clean #toast{display:none}
  #panel{position:fixed;top:56px;right:10px;width:min(320px,calc(100vw - 20px));background:#1b1d2a;color:#eee;border-radius:12px;padding:14px;z-index:5;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:14px}
  #panel.open{display:block}
  #panel label{display:block;margin:8px 0 4px;color:#aab}
  #panel textarea{width:100%;height:120px;box-sizing:border-box;border-radius:8px;border:1px solid #444;background:#10121a;color:#eee;padding:8px;font:inherit;resize:vertical}
  #panel input[type=checkbox]{vertical-align:middle;margin-right:6px}
  #panel input[type=number]{width:80px;border-radius:8px;border:1px solid #444;background:#10121a;color:#eee;padding:6px}
  #panel .row{display:flex;gap:8px;margin-top:12px}
  #panel button{flex:1;padding:9px;border:0;border-radius:8px;background:#5b6cff;color:#fff;font:inherit;cursor:pointer}
  #panel button.sub{background:#3a3d52}
  #panel small{display:block;margin-top:10px;color:#889;line-height:1.5}
  body.clean #ctrls,body.clean #panel{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ctrls"><button id="mus" title="배경음악">🎵</button><button id="snd" title="효과음">🔇</button><button id="gear" title="설정">⚙</button></div>
<div id="toast"></div>
<div id="panel">
  <label for="names">참가자 이름 (한 줄에 하나, 비우면 번호만 사용)</label>
  <textarea id="names" placeholder="민수&#10;지영&#10;..."></textarea>
  <label><input id="lotto" type="checkbox" checked> 로또 모드 (공 45개, 7라운드 = 1회 추첨, 우승 번호는 제외)</label>
  <label for="count">일반 모드 공 개수 (이름이 없을 때, 2~30)</label>
  <input id="count" type="number" min="2" max="30" value="12">
  <div class="row">
    <button id="apply">적용 + 새 라운드</button>
    <button id="skip" class="sub">다음 라운드</button>
  </div>
  <small>단축키: Space 다음 라운드<br>URL 옵션: ?names=a,b,c &amp; balls=12 &amp; seed=1 &amp; map=0~4 &amp; clean=1(설정 버튼 숨김)<br>소리: 화면을 한 번 터치하면 효과음과 배경음악이 켜집니다. 우측 상단 🎵(음악), 🔊(효과음) 버튼으로 각각 끄고 켭니다.</small>
</div>

<script>
'use strict';
/* ============================================================
 * 마블 레이스 (Shorts용 9:16, 약 1분 라운드 자동 반복)
 * - 라운드마다 맵·시드·시작 위치가 바뀌고 화면 구성은 동일
 * - 물리 엔진은 외부 라이브러리 없이 직접 구현 (고정 타임스텝)
 * ============================================================ */

const W = 1080, VIEW_H = 1920;
const RUBBER = 0.22;
const G = 900, VMAX = 400, DRAG = 0.12, STEP = 1 / 240;
const COUNT_T = 3, RACE_CAP = 49, RESULT_T = 8;
const LOTTO_RESULT_T = 4, LOTTO_SUMMARY_T = 11, LOTTO_N = 45, LOTTO_R = 17;
const ANIMALS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐤','🦄','🐴','🐗','🐺','🐲','🦉','🐙','🐳','🐬','🐢','🐥','🦝','🦆','🦅','🦇','🐝','🦋','🐞','🦀','🦑','🐡','🦈','🐊','🦒','🐘','🦘','🦔'];
const FONT = "Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- 맵 생성 ---------------- */
function baseMap(name, H, bg, accent) {
  return { name, H, finishY: H - 380, pegs: [], bumpers: [], segs: [], spinners: [], portals: [], bg, accent };
}

function mapPlinko(rng) {
  const m = baseMap('페그 폭포', 8800, ['#1d2b64', '#f8cdda'], '#ffd166');
  let row = 0;
  for (let y = 520; y < m.H - 700; y += 150, row++) {
    for (let x = row % 2 ? 170 : 100; x < W - 90; x += 140) {
      m.pegs.push({ x: x + (rng() - .5) * 24, y: y + (rng() - .5) * 24, r: 14 });
    }
  }
  return m;
}

function mapSpinners(rng) {
  const m = baseMap('회전 막대', 6800, ['#2b1055', '#7597de'], '#ff9f68');
  let row = 0;
  for (let y = 560; y < m.H - 800; y += 520, row++) {
    for (const fx of [.27, .5, .73]) {
      m.spinners.push({
        cx: W * fx + (rng() - .5) * 60, cy: y + (rng() - .5) * 40, L: 130, r: 10,
        speed: (rng() < .5 ? -1 : 1) * (1.3 + rng() * 1.2), phase: rng() * Math.PI * 2
      });
    }
    for (let x = row % 2 ? 150 : 260; x < W - 110; x += 220) {
      m.pegs.push({ x, y: y + 270 + (rng() - .5) * 30, r: 14 });
    }
  }
  return m;
}

function mapBumpers(rng) {
  const m = baseMap('범퍼 지옥', 7500, ['#42275a', '#734b6d'], '#ff6bd6');
  m.noSprinkle = true;
  const pts = [];
  for (let i = 0; i < 12000 && pts.length < 260; i++) {
    const bump = rng() < .28;
    const r = bump ? 36 : 14;
    const x = 120 + rng() * (W - 240), y = 520 + rng() * (m.H - 1300);
    if (pts.every(p => Math.hypot(p.x - x, p.y - y) > 165)) pts.push({ x, y, r, bump });
  }
  for (const p of pts) (p.bump ? m.bumpers : m.pegs).push({ x: p.x, y: p.y, r: p.r });
  return m;
}

function mapFunnels(rng) {
  const m = baseMap('깔때기 병목', 7800, ['#134e5e', '#71b280'], '#ffe66d');
  let y = 520;
  while (y < m.H - 1100) {
    const gx = 280 + rng() * 520;
    m.segs.push({ x1: 0, y1: y, x2: gx - 65, y2: y + 240, r: 8 });
    m.segs.push({ x1: W, y1: y, x2: gx + 65, y2: y + 240, r: 8 });
    for (let k = 0; k < 2; k++) {
      for (let x = k % 2 ? 175 : 100; x < W - 90; x += 150) {
        m.pegs.push({ x: x + (rng() - .5) * 20, y: y + 420 + k * 130 + (rng() - .5) * 20, r: 14 });
      }
    }
    y += 760;
  }
  return m;
}

function mapPortal(rng) {
  const m = baseMap('포탈 월드', 10200, ['#1a0b3b', '#4a2a8a'], '#7df9ff');
  let row = 0;
  for (let y = 520; y < m.H - 700; y += 190, row++) {
    for (let x = row % 2 ? 170 : 90; x < W - 70; x += 160) {
      m.pegs.push({ x: x + (rng() - .5) * 24, y: y + (rng() - .5) * 24, r: 14 });
    }
  }
  const jumps = [-800, 500, 900, 1500, 2300];
  let y = 800, pair = 0;
  while (y < m.H - 1700) {
    let prevX = -999;
    for (let k = 0; k < 2; k++) {
      let x; do { x = 200 + rng() * 680; } while (Math.abs(x - prevX) < 300);
      prevX = x;
      const py = y + rng() * 240;
      const ty = Math.max(380, Math.min(m.finishY - 400, py + jumps[Math.floor(rng() * jumps.length)]));
      m.portals.push({ x, y: py, r: 44, tx: 160 + rng() * 760, ty, hue: (pair++ * 67 + 190) % 360 });
    }
    y += 1050;
  }
  for (const p of m.portals) {
    for (const [px, py] of [[p.x, p.y], [p.tx, p.ty]]) {
      m.pegs = m.pegs.filter(q => Math.hypot(q.x - px, q.y - py) > 95);
    }
  }
  return m;
}

function mapWindmill(rng) {
  const m = baseMap('풍차 마을', 7200, ['#134e4a', '#f9a826'], '#ffe08a');
  let row = 0;
  for (let y = 620; y < m.H - 900; y += 520, row++) {
    for (const fx of [.2, .5, .8]) {
      const cx = W * fx + (rng() - .5) * 40, cy = y + (rng() - .5) * 40;
      const speed = (rng() < .5 ? -1 : 1) * (1.0 + rng() * .7), ph = rng() * 6.28;
      for (let k = 0; k < 2; k++) m.spinners.push({ cx, cy, L: 110, r: 10, speed, phase: ph + k * Math.PI / 2 });
    }
    for (let x = row % 2 ? 150 : 260; x < W - 110; x += 220) m.pegs.push({ x, y: y + 270 + (rng() - .5) * 30, r: 14 });
  }
  return m;
}

function mapBonus(rng) {
  const m = baseMap('★ 보너스 카오스', 8400, ['#2a1b00', '#a06a00'], '#ffd700');
  m.chaos = true; m.bonus = true;
  let row = 0;
  for (let y = 520; y < m.H - 700; y += 230, row++) {
    for (let x = row % 2 ? 170 : 90; x < W - 70; x += 170) m.pegs.push({ x: x + (rng() - .5) * 28, y: y + (rng() - .5) * 28, r: 14 });
  }
  for (let y = 900; y < m.H - 1500; y += 1100) {
    for (const fx of [.3, .7]) {
      const cx = W * fx + (rng() - .5) * 40, speed = (rng() < .5 ? -1 : 1) * (1.2 + rng() * .8), ph = rng() * 6.28;
      for (let k = 0; k < 2; k++) m.spinners.push({ cx, cy: y, L: 100, r: 10, speed, phase: ph + k * Math.PI / 2 });
    }
  }
  // 풍차와 겹치는 핀 정리
  m.pegs = m.pegs.filter(q => m.spinners.every(sp => Math.hypot(q.x - sp.cx, q.y - sp.cy) > sp.L + 70));
  return m;
}

const MAPS = [mapPlinko, mapPortal, mapSpinners, mapBumpers, mapFunnels, mapWindmill, mapBonus];

/* 벽을 따라 아무 방해 없이 떨어지는 길이 생기지 않도록 양쪽 벽에 비스듬한 턱을 단다 */
function addFins(m, rng) {
  const segs = [];
  for (let y = 470, side = 0; y < m.finishY - 500; y += 120 + rng() * 40, side ^= 1) {
    const len = 70 + rng() * 30, drop = 50 + rng() * 15;
    segs.push(side
      ? { x1: W, y1: y, x2: W - len, y2: y + drop, r: 8 }
      : { x1: 0, y1: y, x2: len, y2: y + drop, r: 8 });
  }
  const free = p => segs.every(sg => segDist(p.x, p.y, sg) > p.r + 62);
  m.pegs = m.pegs.filter(free); m.bumpers = m.bumpers.filter(free);
  m.segs.push(...segs);
  return m;
}
const FINS = new Set([mapPlinko, mapPortal, mapSpinners, mapBumpers, mapWindmill, mapBonus]);
function segDist(px, py, s) {
  const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
  let t = ((px - s.x1) * ex + (py - s.y1) * ey) / (ex * ex + ey * ey);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (s.x1 + t * ex), py - (s.y1 + t * ey));
}

/* 게이트·슬라이더 같은 장치를 놓을 수 있는, 다른 구조물과 겹치지 않는 y를 찾는다 */
function pickClearY(m, y) {
  const bad = yy =>
    m.segs.some(s => Math.abs(s.x2 - s.x1) > 200 && Math.max(s.y1, s.y2) > yy - 100 && Math.min(s.y1, s.y2) < yy + 100) ||
    m.spinners.some(s => Math.abs(s.cy - yy) < s.L + 100) ||
    (m.gates || []).some(g => Math.abs(g.y - yy) < 260) ||
    (m.sliders || []).some(g => Math.abs(g.cy - yy) < 260) ||
    m.portals.some(p => Math.abs(p.y - yy) < 140);
  for (let d = 0; d <= 900; d += 40) {
    if (!bad(y + d)) return y + d;
    if (!bad(y - d)) return y - d;
  }
  return y;
}
function clearBand(m, y, h) {
  m.pegs = m.pegs.filter(p => Math.abs(p.y - y) > h + p.r);
  m.bumpers = m.bumpers.filter(p => Math.abs(p.y - y) > h + p.r);
}
function addPortal(m, rng, py, jump, hue) {
  const x = 300 + rng() * 480;
  const ty = Math.max(620, Math.min(m.finishY - 450, py + jump));
  const p = { x, y: py, r: 48, tx: 160 + rng() * 760, ty, hue };
  m.portals.push(p);
  for (const [qx, qy] of [[p.x, p.y], [p.tx, p.ty]]) m.pegs = m.pegs.filter(q => Math.hypot(q.x - qx, q.y - qy) > 100);
}

/* 끝까지 예측 불가: 셔터(떼로 멈췄다 풀림), 좌우로 움직이는 막대, 뒤로 보내는 함정 포탈과 앞으로 보내는 행운 포탈 */
function addTwists(m, rng) {
  const Fy = m.finishY;
  m.gates = []; m.sliders = [];
  const portalsBefore = m.portals.length;
  const chaos = !!m.chaos;
  for (const [y0, closed, period] of (chaos ? [[Fy * .28, 1.5, 2.8], [Fy * .45, 1.8, 3.2], [Fy * .6, 1.5, 2.8], [Fy * .74, 1.8, 3.2]] : [[Fy * .45, 1.8, 3.4], [Fy * .72, 1.8, 3.4]])) {
    const y = pickClearY(m, y0);
    clearBand(m, y, 60);
    m.gates.push({ y, r: 9, closed, period: period + rng() * .4, phase: rng() * 3.8 });
  }
  // 결승 직전 셔터: 선두가 먼저 도착해도 뒤따르는 공들이 모일 때까지 닫혀 있다가 한꺼번에 열린다 (격차 리셋)
  { const y = pickClearY(m, Fy - 560); clearBand(m, y, 60); m.gates.push({ y, r: 9, final: true, closed: 1, period: 2, phase: 0 }); }
  for (const off of (chaos ? [2700, 2200, 1700, 1250, 800] : [2300, 1700, 1100])) {
    const y = pickClearY(m, Fy - off);
    clearBand(m, y, 80);
    m.sliders.push({ cy: y, cx: W / 2, L: 110, r: 10, A: 290, w: 1.0 + rng() * .8, ph: rng() * 6.28 });
  }
  addPortal(m, rng, pickClearY(m, Fy * .38), 1500, 130);     // 행운(앞으로)
  addPortal(m, rng, pickClearY(m, Fy * .62), 1000, 130);
  addPortal(m, rng, pickClearY(m, Fy * .79), -1500, 0);      // 함정(뒤로)
  addPortal(m, rng, pickClearY(m, Fy * .87), -1300, 0);
  if (chaos) {
    addPortal(m, rng, pickClearY(m, Fy * .18), 1800, 130);
    addPortal(m, rng, pickClearY(m, Fy * .52), 1200, 130);
    addPortal(m, rng, pickClearY(m, Fy * .69), -1700, 0);
    addPortal(m, rng, pickClearY(m, Fy * .93), -1000, 0);
  }
  m.twistPortals = m.portals.length - portalsBefore;
}

/* 핀볼처럼 강하게 튕겨내는 범퍼를 군데군데 */
function addBumpers(m, rng) {
  const Fy = m.finishY, want = Math.round((Fy - 1300) / (m.chaos ? 400 : 650));
  let placed = 0;
  for (let i = 0; i < 900 && placed < want; i++) {
    const x = 140 + rng() * (W - 280), y = 720 + rng() * (Fy - 1300);
    const near = o => Math.hypot(o.x - x, o.y - y) < 120;
    if (m.pegs.some(near) || m.bumpers.some(near)) continue;
    if (m.segs.some(sg => segDist(x, y, sg) < 110)) continue;
    if (m.spinners.some(sp => Math.hypot(sp.cx - x, sp.cy - y) < sp.L + 100)) continue;
    if (m.gates.some(g => Math.abs(g.y - y) < 130) || m.sliders.some(g => Math.abs(g.cy - y) < 170)) continue;
    if (m.portals.some(pt => Math.hypot(pt.x - x, pt.y - y) < 130 || Math.hypot(pt.tx - x, pt.ty - y) < 130)) continue;
    m.bumpers.push({ x, y, r: 34 }); placed++;
  }
}

/* 일직선으로 쭉 떨어지는 구간이 없도록, 공 폭 기준으로 장애물이 없는 세로 구간(maxGap 초과)에 핀을 채운다 */
function fillGaps(m, rng, maxGap = 300) {
  const BIN = 24, NB = Math.ceil(W / BIN), BR = 24;
  const cov = Array.from({ length: NB }, () => []);
  const add = (x, y, rx, ry) => {
    for (let b = Math.max(0, Math.floor((x - rx) / BIN)); b <= Math.min(NB - 1, Math.floor((x + rx) / BIN)); b++) {
      const cx = (b + .5) * BIN;
      if (Math.abs(cx - x) <= rx) cov[b].push([y - ry, y + ry]);
    }
  };
  for (const p of m.pegs) add(p.x, p.y, p.r + BR, p.r + BR);
  for (const p of m.bumpers) add(p.x, p.y, p.r + BR, p.r + BR);
  for (const sg of m.segs) {
    const len = Math.hypot(sg.x2 - sg.x1, sg.y2 - sg.y1), n = Math.max(1, Math.ceil(len / 18));
    for (let i = 0; i <= n; i++) add(sg.x1 + (sg.x2 - sg.x1) * i / n, sg.y1 + (sg.y2 - sg.y1) * i / n, sg.r + BR, sg.r + BR);
  }
  for (const sp of m.spinners) add(sp.cx, sp.cy, sp.r + BR + 36, sp.r + BR + 36);   // 회전 막대는 허브 부분만 확실한 장애물로 본다
  for (const g of m.gates) add(W / 2, g.y, W, g.r + BR);
  for (const g of m.sliders) add(W / 2, g.cy, 170, g.r + BR);
  for (const pt of m.portals) add(pt.x, pt.y, pt.r + BR, pt.r + BR);

  const y0 = 400, y1 = m.finishY - 120;
  for (let pass = 0; pass < 12; pass++) {
    let changed = false;
    for (let b = 1; b < NB - 1; b++) {
      const cx = (b + .5) * BIN;
      if (cx < 30 || cx > W - 30) continue;
      const iv = cov[b].slice().sort((a, c) => a[0] - c[0]);
      let cur = y0, gapA = -1, gapB = -1;
      for (const [a, c] of iv) {
        if (a > cur && a - cur > gapB - gapA) { gapA = cur; gapB = a; }
        if (c > cur) cur = c;
      }
      if (y1 > cur && y1 - cur > gapB - gapA) { gapA = cur; gapB = y1; }
      if (gapB - gapA <= maxGap) continue;
      const bump = rng() < .22;
      const r = bump ? 34 : 14;
      // 빈 구간 안에서 겹치지 않는 자리를 여러 곳 시도
      const span = Math.min(gapB - gapA, maxGap * 1.6);
      let placed = null;
      for (let k = 0; k < 14 && !placed; k++) {
        const fr = [.5, .4, .6, .3, .7, .2, .8][k % 7];
        const x = Math.max(100, Math.min(W - 100, cx + (rng() - .5) * (k < 7 ? 30 : 90)));
        const y = gapA + 40 + (span - 80) * fr;
        const mg = 54;
        const clash = o => Math.hypot(o.x - x, o.y - y) < o.r + r + mg;
        if (m.pegs.some(clash) || m.bumpers.some(clash) || m.segs.some(sg => segDist(x, y, sg) < r + mg + 4)) continue;
        placed = { x, y, r };
      }
      if (!placed) continue;
      (bump ? m.bumpers : m.pegs).push(placed);
      add(placed.x, placed.y, r + BR, r + BR);
      changed = true;
    }
    if (!changed) break;
  }
}

function makeMap(idx, seed) {
  const mk = MAPS[idx], rng = mulberry32(seed);
  const m = mk(rng);
  if (FINS.has(mk)) addFins(m, rng);
  addTwists(m, rng);
  if (!m.noSprinkle) addBumpers(m, rng);
  fillGaps(m, rng);
  return m;
}

/* ---------------- 물리 시뮬레이션 ---------------- */
class Sim {
  constructor(map, names, seed, ids, rOverride) {
    this.map = map;
    this.rng = mulberry32((seed ^ 0x9e3779b9) >>> 0);
    this.t = 0;
    this.finCount = 0;
    this.onHit = null; this.onFinish = null; this.lotto = false;
    this.gustDir = 0; this.gusts = []; this.medY = 0;
    this.chaos = !!map.chaos;
    this.pops = []; this.nextPop = (this.chaos ? 4 : 6) + this.rng() * 2; this.popToast = -99;
    for (let tt = (this.chaos ? 5 : 7) + this.rng() * 4; tt < RACE_CAP; tt += (this.chaos ? 4 : 7) + this.rng() * (this.chaos ? 3 : 5)) this.gusts.push({ t0: tt, dur: 1.2, dir: this.rng() < .5 ? -1 : 1 });
    for (const sl of map.sliders || []) sl.x = sl.cx + sl.A * Math.sin(sl.ph);
    const n = names.length;
    const r = rOverride || (n > 20 ? 19 : 24);
    const order = names.map((_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const perRow = Math.floor((W - 200) / (2 * r + 10));
    this.balls = names.map((name, i) => {
      const slot = order.indexOf(i);
      const row = Math.floor(slot / perRow), col = slot % perRow;
      const inRow = Math.min(perRow, n - row * perRow);
      const span = (inRow - 1) * (2 * r + 10);
      return {
        id: ids ? ids[i] : i + 1, name, r, emoji: ANIMALS[((ids ? ids[i] : i + 1) - 1) % ANIMALS.length], hits: 0, pcd: 0, flash: 0,
        color: `hsl(${(((ids ? ids[i] : i + 1) - 1) * 137.5) % 360},85%,50%)`,
        x: W / 2 - span / 2 + col * (2 * r + 10) + (this.rng() - .5) * 6,
        y: 330 + row * (2 * r + (r < 20 ? 34 : 12)),
        vx: 0, vy: 0, finished: false, rank: 0, time: 0, best: 0, bestT: 0
      };
    });
  }

  get allDone() { return this.finCount === this.balls.length; }

  standings() {
    return [...this.balls].sort((a, b) =>
      a.finished && b.finished ? a.rank - b.rank : a.finished ? -1 : b.finished ? 1 : b.y - a.y);
  }

  hitCircle(b, cx, cy, cr, e, vox, voy, kick, kind) {
    const dx = b.x - cx, dy = b.y - cy, rr = b.r + cr;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr) return false;
    const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d;
    b.x = cx + nx * rr; b.y = cy + ny * rr;
    const vn = (b.vx - vox) * nx + (b.vy - voy) * ny;
    if (vn < 0) {
      b.hits++;
      if (this.onHit) this.onHit(kind, -vn, b);
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      if (kick) { b.vx += nx * kick; b.vy += ny * kick; }
      b.vx += (this.rng() - .5) * 10;
      return true;
    }
    return false;
  }

  hitSeg(b, x1, y1, x2, y2, cr, e, omega, cx, cy, kind) {
    const ex = x2 - x1, ey = y2 - y1;
    let t = ((b.x - x1) * ex + (b.y - y1) * ey) / (ex * ex + ey * ey);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = x1 + t * ex, py = y1 + t * ey;
    const vox = omega ? -omega * (py - cy) : 0, voy = omega ? omega * (px - cx) : 0;
    return this.hitCircle(b, px, py, cr, e, vox, voy, 0, kind);
  }

  hitSegV(b, x1, y1, x2, y2, cr, e, vox, voy, kind) {
    const ex = x2 - x1, ey = y2 - y1;
    let t = ((b.x - x1) * ex + (b.y - y1) * ey) / (ex * ex + ey * ey);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return this.hitCircle(b, x1 + t * ex, y1 + t * ey, cr, e, vox, voy, 0, kind);
  }

  step(dt) {
    this.t += dt;
    const m = this.map, balls = this.balls;
    for (const s of m.spinners) s.a = s.phase + s.speed * this.t;
    for (const sl of m.sliders) { sl.x = sl.cx + sl.A * Math.sin(sl.w * this.t + sl.ph); sl.vx = sl.A * sl.w * Math.cos(sl.w * this.t + sl.ph); }
    for (const p of m.bumpers) if (p.flash > 0) p.flash -= dt;
    for (const q of this.pops) if (q.flash > 0) q.flash -= dt;
    for (const g of m.gates) {
      let open;
      if (g.final) {
        if (!g.opened) {
          const arrived = balls.filter(b => b.y > g.y - 170).length;
          if (arrived > 0 && g.t1 === undefined) g.t1 = this.t;
          if (arrived >= Math.ceil(balls.length * (this.lotto ? .35 : .6)) || (g.t1 !== undefined && this.t - g.t1 > (this.lotto ? 4 : 6.5)) || this.t > RACE_CAP - 9) g.opened = true;
        }
        open = !!g.opened;
      } else open = ((this.t + g.phase) % g.period) >= g.closed;
      if (g.open !== undefined && open !== g.open && this.onHit) this.onHit(open ? 'gateOpen' : 'gateClose', 0, { y: g.y });
      g.open = open;
    }
    const gu = this.gusts.find(q => this.t >= q.t0 && this.t < q.t0 + q.dur);
    const gd = gu ? gu.dir : 0;
    if (gd && !this.gustDir && this.onHit) this.onHit('gust', 0, { y: -1e9, any: true });
    this.gustDir = gd;
    // 돌발 장애물: 선두 바로 앞에 경고 후 강한 범퍼가 잠시 나타난다
    if (this.t >= this.nextPop) {
      this.nextPop = this.t + (this.chaos ? 3 + this.rng() * 1.5 : 5 + this.rng() * 2.5);
      const top3 = balls.filter(b => !b.finished && b.y > 500 && b.y < m.finishY - 800).sort((a, c) => c.y - a.y).slice(0, this.chaos ? 3 : 1);
      const lead = top3[Math.floor(this.rng() * top3.length)];
      if (lead) {
        const px = Math.max(150, Math.min(W - 150, lead.x + (this.rng() - .5) * 140));
        this.pops.push({ x: px, y: lead.y + 440, r: 46, t0: this.t, warn: .7, life: 3.6 });
        this.popToast = this.t;
        if (this.onHit) this.onHit('pop', 0, { y: lead.y + 440 });
      }
    }
    this.pops = this.pops.filter(q => this.t < q.t0 + q.life);
    // 추격 보정: 앞선 공은 조금 느려지고 뒤처진 공은 조금 빨라져 끝까지 순위가 뒤집힐 수 있게 한다
    if ((this.stepN = (this.stepN || 0) + 1) % 12 === 1) {
      const ys = balls.filter(b => !b.finished).map(b => b.y).sort((a, c) => a - c);
      this.medY = ys.length ? ys[ys.length >> 1] : 0;
    }

    for (const b of balls) {
      const rb = b.finished ? 1 : 1 + RUBBER * Math.max(-1, Math.min(1, (this.medY - b.y) / 700));
      b.vy += G * rb * dt;
      if (gd && !b.finished) b.vx += gd * 750 * dt;
      const k = 1 - DRAG * dt; b.vx *= k; b.vy *= k;
      const sp = Math.hypot(b.vx, b.vy), cap = VMAX * rb;
      if (sp > cap) { const f = Math.max(cap / sp, 1 - 3 * dt); b.vx *= f; b.vy *= f; }
      b.x += b.vx * dt; b.y += b.vy * dt;

      if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx *= -.4; }
      else if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) b.vx *= -.4; }
      if (b.y > m.H - b.r) { b.y = m.H - b.r; if (b.vy > 0) b.vy *= -.3; b.vx *= .985; }

      if (b.flash > 0) b.flash -= dt;
      if (b.pcd > 0) b.pcd -= dt;
      else if (!b.finished) {
        for (const p of m.portals) {
          if (Math.abs(p.y - b.y) > p.r || Math.hypot(b.x - p.x, b.y - p.y) > p.r) continue;
          b.x = p.tx; b.y = p.ty; b.vx = (this.rng() - .5) * 160; b.vy = Math.max(80, b.vy * .5);
          b.pcd = .8; b.flash = .5; b.best = b.y; b.bestT = this.t;
          if (this.onHit) this.onHit('portal', 0, b);
          break;
        }
      }

      const lo = b.y - b.r - 60, hi = b.y + b.r + 60;
      for (const p of m.pegs) if (p.y > lo && p.y < hi) this.hitCircle(b, p.x, p.y, p.r, .55, 0, 0, 0, 'peg');
      for (const p of m.bumpers) if (p.y > lo - 30 && p.y < hi + 30 && this.hitCircle(b, p.x, p.y, p.r, 1.15, 0, 0, 330, 'bumper')) p.flash = .22;
      for (const s of m.segs) {
        if (Math.max(s.y1, s.y2) < lo || Math.min(s.y1, s.y2) > hi) continue;
        this.hitSeg(b, s.x1, s.y1, s.x2, s.y2, s.r, .3, 0, 0, 0, 'seg');
      }
      for (const s of m.spinners) {
        if (s.cy + s.L < lo || s.cy - s.L > hi) continue;
        const c = Math.cos(s.a) * s.L, sn = Math.sin(s.a) * s.L;
        this.hitSeg(b, s.cx - c, s.cy - sn, s.cx + c, s.cy + sn, s.r, .6, s.speed, s.cx, s.cy, 'spin');
      }

      for (const q of this.pops) {
        if (this.t >= q.t0 + q.warn && Math.abs(q.y - b.y) < q.r + b.r + 30 && this.hitCircle(b, q.x, q.y, q.r, 1.2, 0, 0, 380, 'bumper')) q.flash = .25;
      }
      for (const sl of m.sliders) {
        if (Math.abs(sl.cy - b.y) > sl.r + b.r + 30) continue;
        this.hitSegV(b, sl.x - sl.L, sl.cy, sl.x + sl.L, sl.cy, sl.r, .7, sl.vx, 0, 'spin');
      }
      for (const g of m.gates) {
        if (!g.open && Math.abs(g.y - b.y) < g.r + b.r + 30) this.hitSeg(b, 0, g.y, W, g.y, g.r, .2, 0, 0, 0, 'seg');
      }

      if (!b.finished) {
        if (b.y > m.finishY) { b.finished = true; b.rank = ++this.finCount; b.time = this.t; if (this.onFinish) this.onFinish(b); }
        else if (b.y > b.best + 40) { b.best = b.y; b.bestT = this.t; }
        else if (this.t - b.bestT > 1.8 && !m.gates.some(g => !g.open && g.y > b.y && g.y - b.y < 90)) {   // 끼임 방지 (닫힌 셔터 위는 제외)
          b.vx += (this.rng() - .5) * 500; b.vy -= 250; b.bestT = this.t;
        }
      }
    }

    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      for (let j = i + 1; j < balls.length; j++) {
        const c = balls[j];
        const dx = a.x - c.x; if (dx > 60 || dx < -60) continue;
        const dy = a.y - c.y, rr = a.r + c.r, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d, ov = (rr - d) / 2;
        a.x += nx * ov; a.y += ny * ov; c.x -= nx * ov; c.y -= ny * ov;
        const vn = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
        if (vn < 0) {
          if (this.onHit) this.onHit('ball', -vn, a);
          const imp = -(1 + .6) * vn / 2;
          a.vx += imp * nx; a.vy += imp * ny; c.vx -= imp * nx; c.vy -= imp * ny;
        }
      }
    }
  }
}

const params = new URLSearchParams(location.search);
if (params.get('clean') === '1') document.body.classList.add('clean');

function loadSettings() {
  let names = [], count = 12, lotto = true;
  try {
    const s = JSON.parse(localStorage.getItem('marble.settings') || '{}');
    if (Array.isArray(s.names)) names = s.names;
    if (s.count) count = s.count;
    if (typeof s.lotto === 'boolean') lotto = s.lotto;
  } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  if (params.get('names')) names = params.get('names').split(',').map(s => s.trim()).filter(Boolean);
  if (params.get('balls')) count = +params.get('balls');
  if (params.get('lotto') === '0') lotto = false;
  if (params.get('lotto') === '1') lotto = true;
  count = Math.max(2, Math.min(30, count | 0 || 12));
  return { names: names.slice(0, 30), count, lotto };
}
function saveSettings(s) { try { localStorage.setItem('marble.settings', JSON.stringify(s)); } catch (e) { } }

/* ---------------- 효과음 (WebAudio 합성, 파일 없음) ---------------- */
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319];
const Sfx = {
  ctx: null, master: null, enabled: true, last: {},
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const comp = this.ctx.createDynamicsCompressor();
        this.master = this.ctx.createGain(); this.master.gain.value = .8;
        this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = .55;
        this.master.connect(comp); this.musicBus.connect(comp); comp.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* 오디오를 쓸 수 없는 환경 */ }
  },
  get on() { return !!(this.enabled && this.ctx && this.ctx.state === 'running'); },
  gate(kind, gap) {
    const n = performance.now();
    if (n - (this.last[kind] || 0) < gap) return false;
    this.last[kind] = n; return true;
  },
  tone(f, dur, type, vol, f2, delay, bus) {
    if (!this.ctx || this.ctx.state !== 'running' || (!bus && !this.enabled)) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(bus || this.master); o.start(t); o.stop(t + dur + .03);
  },
  noise(dur, vol, f1, f2, delay, bus) {
    if (!this.ctx || this.ctx.state !== 'running' || (!bus && !this.enabled)) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 3;
    fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .25);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(bus || this.master); src.start(t);
  },
  peg(v) { if (this.gate('peg', 40)) this.tone(PENTA[(Math.random() * PENTA.length) | 0] * (Math.random() < .3 ? .5 : 1), .09, 'sine', .05 + .1 * v); },
  ball(v) { if (this.gate('ball', 70)) this.tone(260 + Math.random() * 80, .06, 'triangle', .05 + .09 * v, 140); },
  seg(v) { if (this.gate('seg', 70)) this.tone(180 + Math.random() * 40, .07, 'triangle', .04 + .06 * v, 110); },
  spin(v) { if (this.gate('spin', 60)) this.tone(420, .05, 'square', .03 + .05 * v, 300); },
  bumper(v) { if (this.gate('bumper', 90)) this.tone(260, .16, 'sine', .12 + .1 * v, 720); },
  portal() { this.noise(.45, .25, 300, 2400); this.tone(500, .3, 'sine', .08, 1500); },
  pop() { this.tone(880, .12, 'square', .12, 440); this.tone(880, .12, 'square', .12, 440, .16); },
  gateClose() { this.tone(110, .18, 'triangle', .2, 60); },
  gateOpen() { this.tone(220, .14, 'triangle', .14, 520); },
  gust() { this.noise(1.0, .22, 300, 1500); },
  tick(n) { this.tone(n > 0 ? 660 : 990, n > 0 ? .12 : .35, 'sine', .22); },
  whoosh() { this.noise(.5, .18, 200, 1800); },
  finish(rank) { this.tone(Math.max(500, 920 - rank * 28), .22, 'triangle', .16); },
  fanfare() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .28, 'triangle', .2, 0, i * .09)); this.tone(262, .9, 'sine', .12, 0, .3); },
  hit(kind, speed) { const v = Math.min(1, speed / 450); (this[kind] || (() => { })).call(this, v); }
};

/* ---------------- 배경음악 (직접 작곡한 8마디 루프, 합성음) ---------------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const Music = {
  enabled: true, timer: null, step: 0, next: 0, bpm: 128,
  chords: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50], [48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]],
  lead: [
    [[0, 76, 2], [2, 79, 2], [4, 84, 4], [8, 83, 2], [10, 79, 2], [12, 76, 4]],
    [[0, 76, 2], [2, 81, 2], [4, 84, 4], [8, 81, 2], [10, 76, 2], [12, 72, 4]],
    [[0, 77, 2], [2, 81, 2], [4, 84, 4], [8, 81, 2], [10, 77, 2], [12, 81, 4]],
    [[0, 79, 2], [2, 83, 2], [4, 86, 4], [8, 83, 2], [10, 79, 2], [12, 74, 4]],
    [[0, 84, 3], [3, 84, 1], [4, 79, 4], [8, 76, 2], [10, 79, 2], [12, 84, 4]],
    [[0, 81, 3], [3, 81, 1], [4, 76, 4], [8, 72, 2], [10, 76, 2], [12, 81, 4]],
    [[0, 81, 2], [2, 84, 2], [4, 89, 4], [8, 84, 2], [10, 81, 2], [12, 77, 4]],
    [[0, 83, 2], [2, 86, 2], [4, 83, 2], [6, 79, 2], [8, 74, 4], [12, 79, 2], [14, 83, 2]]
  ],
  get running() { return !!(this.timer && Sfx.enabled && Sfx.ctx && Sfx.ctx.state === 'running'); },
  start() {
    if (this.timer || !this.enabled || !Sfx.enabled || !Sfx.ctx) return;
    const c = Sfx.ctx;
    Sfx.musicBus.gain.cancelScheduledValues(c.currentTime);
    Sfx.musicBus.gain.setValueAtTime(.55, c.currentTime);
    this.next = c.currentTime + .08; this.step = 0;
    this.timer = setInterval(() => this.pump(), 30);
  },
  stop() {
    clearInterval(this.timer); this.timer = null;
    if (Sfx.ctx && Sfx.musicBus) {   // 이미 예약된 음도 바로 끊는다
      const c = Sfx.ctx;
      Sfx.musicBus.gain.cancelScheduledValues(c.currentTime);
      Sfx.musicBus.gain.setTargetAtTime(0, c.currentTime, .015);
    }
  },
  pump() {
    const c = Sfx.ctx; if (!c || c.state !== 'running' || !this.enabled || !Sfx.enabled) return;
    const dur = 60 / this.bpm / 4;
    if (this.next < c.currentTime - .3) this.next = c.currentTime + .05;   // 탭이 멈췄다 돌아온 경우
    while (this.next < c.currentTime + .15) { this.play(this.step, this.next, dur); this.next += dur; this.step++; }
  },
  play(n, t, d) {
    const c = Sfx.ctx, bus = Sfx.musicBus, st = n % 16, bar = Math.floor(n / 16) % 8, delay = Math.max(0, t - c.currentTime);
    const ch = this.chords[bar];
    if (st % 4 === 0) Sfx.tone(160, .14, 'sine', .42, 42, delay, bus);                           // 킥
    if (st === 4 || st === 12) Sfx.noise(.12, .16, 2200, 1200, delay, bus);                      // 스네어
    if (st % 2 === 0) Sfx.noise(.04, st % 4 === 2 ? .07 : .04, 7000, 9000, delay, bus);         // 하이햇
    if (st % 4 === 0 || st % 4 === 3) Sfx.tone(mtof(ch[0]), d * 1.7, 'sawtooth', .13, 0, delay, bus);   // 베이스
    Sfx.tone(mtof(ch[[0, 1, 2, 1][st % 4]] + 24), d * .9, 'triangle', .06, 0, delay, bus);       // 아르페지오
    for (const [at, note, len] of this.lead[bar]) if (at === st) Sfx.tone(mtof(note), d * len * .95, 'square', .05, 0, delay, bus);
  }
};

/* ---------------- 게임 흐름 ---------------- */
class Game {
  constructor(settings) {
    this.settings = settings;
    this.round = 0;
    this.mapBag = [];
    this.fixedSeed = params.has('seed') ? +params.get('seed') : null;
    this.fixedMap = params.has('map') ? +params.get('map') : null;
    this.reset();
  }

  get lotto() { return !!this.settings.lotto; }

  reset() {
    this.round = 0; this.cycle = 1; this.cycleRound = 0; this.drawn = []; this.cycleMaps = null; this.mapBag = [];
    this.startRound();
  }

  /* 한 사이클: 일반 맵 6개를 섞어서 + 마지막은 항상 보너스 맵 */
  makeCycleMaps() {
    const bag = MAPS.slice(0, -1).map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    return [...bag, MAPS.length - 1];
  }

  participants() {
    const { names, count } = this.settings;
    if (names.length >= 2) return names.map((n, i) => ({ name: n }));
    return Array.from({ length: count }, (_, i) => ({ name: '' }));
  }

  nextMapIndex() {
    if (this.fixedMap !== null && !isNaN(this.fixedMap)) return this.fixedMap % MAPS.length;
    if (!this.mapBag.length) {
      this.mapBag = MAPS.slice(0, -1).map((_, i) => i);
      for (let i = this.mapBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.mapBag[i], this.mapBag[j]] = [this.mapBag[j], this.mapBag[i]];
      }
    }
    return this.mapBag.pop();
  }

  startRound() {
    this.round++;
    this.cam = 0;
    let ids = null, idx;
    if (this.lotto) {
      if (this.drawn.length >= 7) { this.drawn = []; this.cycle++; this.cycleRound = 0; this.cycleMaps = null; }
      if (!this.cycleMaps) this.cycleMaps = this.makeCycleMaps();
      this.cycleRound++;
      idx = this.fixedMap !== null && !isNaN(this.fixedMap) ? this.fixedMap % MAPS.length : this.cycleMaps[this.cycleRound - 1];
      ids = Array.from({ length: LOTTO_N }, (_, i) => i + 1).filter(n => !this.drawn.includes(n));
    } else idx = this.nextMapIndex();
    this.bonusRound = this.lotto && MAPS[idx] === mapBonus;
    const seed = this.fixedSeed !== null ? this.fixedSeed + this.round - 1 : (Math.random() * 2 ** 31) | 0;
    const map = makeMap(idx, seed);
    this.sim = ids
      ? new Sim(map, ids.map(() => ''), seed, ids, LOTTO_R)
      : new Sim(map, this.participants().map(p => p.name), seed);
    this.sim.lotto = this.lotto;
    this.sim.onHit = (kind, speed, b) => {
      if (!b.any && (b.y < this.cam - 120 || b.y > this.cam + VIEW_H + 120)) return;   // 화면 밖 소리는 내지 않음
      Sfx.hit(kind, speed);
    };
    this.sim.onFinish = b => { if (b.rank === 1) Sfx.fanfare(); else Sfx.finish(b.rank); };
    if (this.round > 1) Sfx.whoosh();
    this.lastTick = 99;
    this.phase = 'count'; this.phaseT = 0; this.acc = 0;
    this.clock = 0; this.raceEnd = 0;
    this.confetti = []; this.winnerShown = false; this.final = null;
  }

  skip() { if (this.lotto) this.cycleRound = Math.max(0, this.cycleRound - 1); this.startRound(); }

  update(dt) {
    dt = Math.min(dt, .05);
    this.clock += dt;
    const sim = this.sim;
    if (this.phase === 'count') {
      this.phaseT += dt;
      const n = Math.ceil(COUNT_T - this.phaseT);
      if (n !== this.lastTick && n > 0) { this.lastTick = n; Sfx.tick(n); }
      if (this.phaseT >= COUNT_T) { this.phase = 'race'; this.phaseT = 0; Sfx.tick(0); }
    } else if (this.phase === 'race') {
      this.acc += dt;
      while (this.acc >= STEP) { sim.step(STEP); this.acc -= STEP; }
      if (sim.finCount > 0 && !this.winnerShown) { this.winnerShown = true; this.winnerAt = sim.t; this.spawnConfetti(); }
      const finished = this.lotto ? (sim.finCount > 0 && sim.t - this.winnerAt > 1.3) : sim.allDone;
      if (finished || sim.t >= RACE_CAP) {
        this.phase = 'result'; this.phaseT = 0; this.final = sim.standings();
        if (!this.winnerShown) { this.winnerShown = true; this.spawnConfetti(); }
        if (this.lotto) { this.drawn.push(this.final[0].id); this.spawnConfetti(); }
      }
    } else if (this.phase === 'summary') {
      this.phaseT += dt;
      if (this.phaseT >= LOTTO_SUMMARY_T) this.startRound();
    } else {
      this.phaseT += dt;
      this.acc += dt;
      while (this.acc >= STEP) { sim.step(STEP); this.acc -= STEP; }
      if (this.lotto) {
        if (this.phaseT >= LOTTO_RESULT_T) {
          if (this.drawn.length >= 7) { this.phase = 'summary'; this.phaseT = 0; Sfx.fanfare(); this.spawnConfetti(); }
          else this.startRound();
        }
      } else if (this.phaseT >= RESULT_T) this.startRound();
    }
    this.updateCamera(dt);
    for (const c of this.confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 500 * dt; c.rot += c.vr * dt; }
    this.confetti = this.confetti.filter(c => c.y < VIEW_H + 40);
  }

  updateCamera(dt) {
    const sim = this.sim, H = sim.map.H;
    let target;
    if (this.phase === 'count') target = 0;
    else if (this.phase === 'result' || this.phase === 'summary') target = H - VIEW_H;
    else {
      const ys = sim.balls.filter(b => !b.finished).map(b => b.y).sort((a, b) => b - a);
      const lead = ys.length ? (ys[0] + (ys[1] ?? ys[0]) + (ys[2] ?? ys[0])) / 3 : H;
      target = lead - VIEW_H * .38;
    }
    target = Math.max(0, Math.min(H - VIEW_H, target));
    this.cam += (target - this.cam) * Math.min(1, dt * 4);
  }

  spawnConfetti() {
    const cols = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#fff'];
    for (let i = 0; i < 140; i++) {
      this.confetti.push({
        x: Math.random() * W, y: -Math.random() * 600, vx: (Math.random() - .5) * 220, vy: 100 + Math.random() * 300,
        rot: Math.random() * 6, vr: (Math.random() - .5) * 10, c: cols[i % cols.length], s: 10 + Math.random() * 12
      });
    }
  }
}

/* ---------------- 렌더링 ---------------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize() {
  let h = innerHeight, w = h * 9 / 16;
  if (w > innerWidth) { w = innerWidth; h = w * 16 / 9; }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  scale = canvas.width / W;
}
addEventListener('resize', resize); resize();

function text(str, x, y, size, color, align = 'center', stroke = true, weight = 800) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size * .14); ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

const spriteCache = new Map();
function animal(ch, x, y, size) {
  const k = ch + '|' + size + '|' + Math.round(scale * 50);
  let c = spriteCache.get(k);
  if (!c) {
    const box = size * 1.4, px = Math.max(2, Math.ceil(box * Math.max(scale, 1)));
    c = document.createElement('canvas'); c.width = c.height = px;
    const g = c.getContext('2d');
    g.font = `${px / 1.4}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, px / 2, px / 2 + px * .04);
    spriteCache.set(k, c);
  }
  const box = size * 1.4;
  ctx.drawImage(c, x - box / 2, y - box / 2, box, box);
}

function drawPortals(m, top, bot, t) {
  for (const p of m.portals) {
    const col = `hsl(${p.hue},95%,68%)`;
    if (p.y > top - 80 && p.y < bot + 80) {
      const g = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, p.r + 18);
      g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(.7, `hsla(${p.hue},95%,60%,.55)`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 18, 0, 7); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.setLineDash([20, 12]); ctx.lineDashOffset = -t * 60;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      text('IN', p.x, p.y + 1, 30, '#fff');
    }
    if (p.ty > top - 80 && p.ty < bot + 80) {
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.setLineDash([6, 10]); ctx.lineDashOffset = t * 40;
      ctx.beginPath(); ctx.arc(p.tx, p.ty, p.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = `hsla(${p.hue},95%,60%,.25)`; ctx.beginPath(); ctx.arc(p.tx, p.ty, p.r, 0, 7); ctx.fill();
      text('OUT', p.tx, p.ty + 1, 26, '#fff');
    }
  }
}

function drawWorld(game) {
  const sim = game.sim, m = sim.map, cam = game.cam;
  const grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  grad.addColorStop(0, m.bg[0]); grad.addColorStop(1, m.bg[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, VIEW_H);

  ctx.save();
  ctx.translate(0, -cam);
  const top = cam - 80, bot = cam + VIEW_H + 80;

  // 100px 눈금(속도감)
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  for (let y = Math.floor(top / 200) * 200; y < bot; y += 200) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // 피니시 라인
  const fy = m.finishY;
  if (fy > top - 100 && fy < bot + 100) {
    const sq = 40;
    for (let i = 0; i < W / sq; i++) for (let j = 0; j < 2; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(i * sq, fy + j * sq, sq, sq);
    }
    text('FINISH', W / 2, fy + 150, 90, '#fff');
  }

  drawPortals(m, top, bot, performance.now() / 1000);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const p of m.pegs) {
    if (p.y < top || p.y > bot) continue;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  for (const p of m.bumpers) {
    if (p.y < top || p.y > bot) continue;
    const f = p.flash > 0 ? p.flash / .22 : 0, rr = p.r * (1 + f * .25);
    const g = ctx.createRadialGradient(p.x, p.y, rr * .2, p.x, p.y, rr + 22);
    g.addColorStop(0, `rgba(255,255,255,${.25 + f * .5})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, rr + 22, 0, 7); ctx.fill();
    ctx.fillStyle = f > 0 ? '#fff' : m.accent; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.stroke();
    ctx.fillStyle = f > 0 ? m.accent : 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, rr * .45, 0, 7); ctx.fill();
  }
  ctx.lineCap = 'round';
  ctx.strokeStyle = m.accent;
  for (const s of m.segs) {
    if (Math.max(s.y1, s.y2) < top || Math.min(s.y1, s.y2) > bot) continue;
    ctx.lineWidth = s.r * 2; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  for (const s of m.spinners) {
    if (s.cy + s.L < top || s.cy - s.L > bot) continue;
    const a = s.a ?? s.phase, c = Math.cos(a) * s.L, sn = Math.sin(a) * s.L;
    ctx.strokeStyle = m.accent; ctx.lineWidth = s.r * 2;
    ctx.beginPath(); ctx.moveTo(s.cx - c, s.cy - sn); ctx.lineTo(s.cx + c, s.cy + sn); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.cx, s.cy, 9, 0, 7); ctx.fill();
  }
  for (const sl of m.sliders) {
    if (sl.cy < top - 40 || sl.cy > bot + 40) continue;
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 4; ctx.setLineDash([14, 14]);
    ctx.beginPath(); ctx.moveTo(sl.cx - sl.A - sl.L, sl.cy); ctx.lineTo(sl.cx + sl.A + sl.L, sl.cy); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#ff7a59'; ctx.lineWidth = sl.r * 2;
    ctx.beginPath(); ctx.moveTo(sl.x - sl.L, sl.cy); ctx.lineTo(sl.x + sl.L, sl.cy); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sl.x, sl.cy, 7, 0, 7); ctx.fill();
  }
  const simT = sim.t;
  for (const g of m.gates) {
    if (g.y < top - 40 || g.y > bot + 40) continue;
    ctx.lineCap = 'butt';
    if (g.open) {
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6; ctx.setLineDash([22, 18]);
      ctx.beginPath(); ctx.moveTo(0, g.y); ctx.lineTo(W, g.y); ctx.stroke(); ctx.setLineDash([]);
    } else {
      const pt = g.final ? 0 : (simT + g.phase) % g.period, soon = !g.final && g.closed - pt < .5 && Math.floor(pt * 8) % 2 === 0;
      ctx.strokeStyle = soon ? '#ffd166' : '#ff4d4d'; ctx.lineWidth = g.r * 2;
      ctx.beginPath(); ctx.moveTo(0, g.y); ctx.lineTo(W, g.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 5; ctx.setLineDash([26, 26]); ctx.lineDashOffset = 0;
      ctx.beginPath(); ctx.moveTo(0, g.y); ctx.lineTo(W, g.y); ctx.stroke(); ctx.setLineDash([]);
      if (g.final) text('FINAL GATE', W / 2, g.y - 34, 38, '#ffd166');
    }
    ctx.lineCap = 'round';
  }
  for (const q of sim.pops) {
    if (q.y < top - 80 || q.y > bot + 80) continue;
    const age = simT - q.t0;
    if (age < q.warn) {
      const on = Math.floor(age * 10) % 2 === 0;
      ctx.strokeStyle = on ? '#ff4d4d' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 8; ctx.setLineDash([16, 12]);
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 8, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      text('!', q.x, q.y + 2, 64, '#ff4d4d');
    } else {
      const f = q.flash > 0 ? q.flash / .25 : 0, rr = q.r * (1 + f * .2), fade = Math.min(1, (q.life - age) * 2);
      ctx.save(); ctx.globalAlpha = fade;
      ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(q.x, q.y, rr, 0, 7); ctx.fill();
      ctx.strokeStyle = f > 0 ? '#fff' : '#ff4d4d'; ctx.lineWidth = 8; ctx.stroke();
      animal('💣', q.x, q.y + 2, rr * 1.3);
      ctx.restore();
    }
  }

  // 공 (동물 얼굴)
  const lead = game.phase === 'race' ? sim.standings()[0] : null;
  const vis = sim.balls.filter(b => b.y > top - 120 && b.y < bot + 60);
  for (const b of vis) {
    if (b.flash > 0) {
      ctx.strokeStyle = `rgba(255,255,255,${b.flash * 1.6})`; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + (.5 - b.flash) * 160, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = b.color; ctx.lineWidth = b.r < 20 ? 3.5 : 5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    if (b === lead) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, 0, 7); ctx.stroke(); }
    animal(b.emoji, b.x, b.y + 1, b.r * 1.7);
  }
  // 번호표: 회전·충돌과 무관하게 항상 얼굴 바로 위에 똑바로 붙어 다님
  for (const b of vis) {
    const label = String(b.id), fs = Math.max(19, Math.round(b.r * .95)), bh = fs + 8, bw = 16 + label.length * fs * .62, by = b.y - b.r - bh / 2 - 3;
    ctx.fillStyle = b.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    rrect(b.x - bw / 2, by - bh / 2, bw, bh, bh / 2); ctx.fill(); ctx.stroke();
    text(label, b.x, by + 1, fs, '#fff', 'center', false);
    if (b.name) text(b.name, b.x, by - bh / 2 - 14, 24, '#fff');
  }
  ctx.restore();
}

function fmtTime(t) { const s = Math.max(0, Math.floor(t)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function drawTray(game, m) {   // 당첨 번호 칸: 6개 + 보너스
  const y = VIEW_H - 285;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rrect(40, y - 62, W - 80, 124, 36); ctx.fill();
  const xs = [0, 1, 2, 3, 4, 5].map(i => 120 + i * 112);
  xs.push(W - 130);
  text('+', W - 215, y, 56, '#ffd700');
  xs.forEach((x, i) => {
    const n = game.drawn[i], bonus = i === 6;
    ctx.fillStyle = n ? 'rgba(255,255,255,.96)' : 'rgba(255,255,255,.12)';
    ctx.strokeStyle = bonus ? '#ffd700' : n ? m.accent : 'rgba(255,255,255,.35)'; ctx.lineWidth = n ? 5 : 3;
    ctx.beginPath(); ctx.arc(x, y, 42, 0, 7); ctx.fill(); ctx.stroke();
    if (n) {
      animal(ANIMALS[(n - 1) % ANIMALS.length], x, y - 4, 58);
      ctx.fillStyle = bonus ? '#ffd700' : m.accent; rrect(x - 24, y + 22, 48, 28, 14); ctx.fill();
      text(String(n), x, y + 37, 24, bonus ? '#3a2600' : '#fff', 'center', false);
    } else text('?', x, y + 2, 44, 'rgba(255,255,255,.5)', 'center', false);
  });
}

function drawHUD(game) {
  const sim = game.sim, m = sim.map;

  // 상단 바
  ctx.fillStyle = 'rgba(0,0,0,.42)'; rrect(30, 40, W - 60, 150, 30); ctx.fill();
  if (game.lotto) {
    text(`제 ${game.cycle}회 추첨 · ${game.cycleRound}/7`, 70, 92, 44, game.bonusRound ? '#ffd700' : '#fff', 'left');
  } else text(`ROUND ${game.round}`, 70, 92, 44, '#fff', 'left');
  text(m.name, 70, 148, 40, m.accent, 'left');
  const raceT = game.phase === 'count' ? 0 : sim.t;
  text(fmtTime(Math.min(raceT, RACE_CAP)), W - 70, 115, 90, '#fff', 'right');

  // 라운드 진행 바
  if (game.lotto) {   // 7칸 진행 표시 (마지막 칸은 보너스)
    const segW = (W - 120 - 6 * 10) / 7;
    for (let i = 0; i < 7; i++) {
      const done = i < game.drawn.length, cur = i === game.cycleRound - 1 && !done;
      ctx.fillStyle = done ? (i === 6 ? '#ffd700' : m.accent) : cur ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.2)';
      rrect(60 + i * (segW + 10), 200, segW, 12, 6); ctx.fill();
    }
  } else {
    const total = COUNT_T + RACE_CAP + RESULT_T;
    const prog = Math.min(1, game.clock / total);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; rrect(60, 200, W - 120, 12, 6); ctx.fill();
    ctx.fillStyle = m.accent; rrect(60, 200, Math.max(12, (W - 120) * prog), 12, 6); ctx.fill();
  }
  if (game.bonusRound && game.phase !== 'summary') {
    const pulse = .75 + .25 * Math.sin(performance.now() / 180);
    ctx.save(); ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd700'; rrect(W / 2 - 150, 226, 300, 54, 27); ctx.fill();
    text('★ BONUS ROUND ★', W / 2, 254, 34, '#3a2600', 'center', false);
    ctx.restore();
  }

  // 실시간 순위 (우측)
  if (game.phase !== 'count') {   // 출발 전에는 시작 줄을 가리지 않도록 숨김
    const st = sim.standings().slice(0, 5);
    ctx.fillStyle = 'rgba(0,0,0,.42)'; rrect(W - 380, 250, 350, 60 + st.length * 62, 24); ctx.fill();
    text('TOP 5', W - 205, 285, 34, '#fff');
    st.forEach((b, i) => {
      const y = 345 + i * 62;
      animal(b.emoji, W - 336, y, 40);
      text(`${i + 1}위  #${b.id} ${b.name || ''}`.trim(), W - 300, y, 30, '#fff', 'left');
    });
  }

  // 좌측 미니 진행 트랙
  const tx = 52, ty0 = 260, tyl = 1100;
  ctx.fillStyle = 'rgba(0,0,0,.42)'; rrect(tx - 20, ty0 - 24, 40, tyl + 48, 20); ctx.fill();
  for (const b of sim.balls) {
    const p = Math.max(0, Math.min(1, b.y / sim.map.finishY));
    animal(b.emoji, tx, ty0 + p * tyl, sim.balls.length > 30 ? 18 : 26);
  }
  ctx.fillStyle = '#fff'; ctx.fillRect(tx - 20, ty0 + tyl + 28, 40, 6);

  // 하단 안내
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rrect(60, VIEW_H - 190, W - 120, 120, 36); ctx.fill();
  text(game.lotto ? '응원하는 번호를 댓글로 남겨보세요!' : '응원할 공 번호를 댓글로 남겨보세요!', W / 2, VIEW_H - 130, 46, '#fff');

  // 돌풍 / 돌발 장애물 안내
  if (sim.gustDir && game.phase === 'race') {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    const tt = performance.now() / 1000;
    for (let i = 0; i < 14; i++) {
      const y = 260 + ((i * 197) % 1400), len = 120 + (i % 3) * 60;
      let x = ((tt * 1500 * sim.gustDir + i * 311) % (W + 300) + (W + 300)) % (W + 300) - 150;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * sim.gustDir, y); ctx.stroke();
    }
    ctx.restore();
    text(sim.gustDir > 0 ? '돌풍! →' : '← 돌풍!', W / 2, 340, 72, '#bff3ff');
  }
  if (game.phase === 'race' && sim.t - sim.popToast < 1.8) {
    text('돌발 장애물 출현!', W / 2, sim.gustDir ? 430 : 340, 60, '#ff7a59');
  }

  // 카운트다운
  if (game.phase === 'count') {
    const left = Math.ceil(COUNT_T - game.phaseT);
    const f = (COUNT_T - game.phaseT) % 1;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(0, 0, W, VIEW_H);
    ctx.save(); ctx.translate(W / 2, VIEW_H / 2); ctx.scale(1 + (1 - f) * .25, 1 + (1 - f) * .25);
    text(String(left), 0, 0, 380, '#fff'); ctx.restore();
    text('준비!', W / 2, VIEW_H / 2 - 300, 90, m.accent);
  }

  // 1등 배너
  if (game.phase === 'race' && game.winnerShown) {
    const w = sim.standings()[0];
    const age = sim.t - game.winnerAt;
    if (age < 5) {
      const a = Math.min(1, age * 4, (5 - age) * 2);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(90, 700, W - 180, 230, 40); ctx.fill();
      text('1등 도착!', W / 2 + 40, 770, 64, '#ffd166');
      animal(w.emoji, W / 2 - 250, 800, 120);
      text(`#${w.id} ${w.name || ''}`.trim(), W / 2 + 40, 860, 78, '#fff');
      ctx.restore();
    }
  }

  // 결과
  if (game.lotto && (game.phase === 'result' || game.phase === 'summary') && game.final) {
    ctx.fillStyle = game.phase === 'summary' ? 'rgba(0,0,0,.9)' : 'rgba(0,0,0,.66)'; ctx.fillRect(0, 0, W, VIEW_H);
    if (game.phase === 'result') {
      const w = game.final[0], k = game.drawn.length, bonus = k === 7;
      text(bonus ? '★ 보너스 번호 ★' : `${k}번째 추첨 번호`, W / 2, 520, 84, bonus ? '#ffd700' : '#ffd166');
      ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.strokeStyle = bonus ? '#ffd700' : w.color; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(W / 2, 800, 190, 0, 7); ctx.fill(); ctx.stroke();
      animal(w.emoji, W / 2, 800, 270);
      text(String(w.id), W / 2, 1110, 230, '#fff');
      text(`남은 공 ${LOTTO_N - k}개`, W / 2, 1330, 44, m.accent);
    } else {
      const sorted = [...game.drawn.slice(0, 6)].sort((a, b) => a - b), bonus = game.drawn[6];
      text(`제 ${game.cycle}회 당첨 번호`, W / 2, 440, 92, '#ffd166');
      sorted.forEach((n, i) => {
        const x = W / 2 + ((i % 3) - 1) * 300, y = 700 + Math.floor(i / 3) * 330;
        ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.strokeStyle = m.accent; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(x, y, 100, 0, 7); ctx.fill(); ctx.stroke();
        animal(ANIMALS[(n - 1) % ANIMALS.length], x, y - 4, 130);
        text(String(n), x, y + 125, 76, '#fff');
      });
      text('+ 보너스', W / 2, 1380, 54, '#ffd700');
      const bx = W / 2, by = 1540;
      ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(bx - 90, by, 90, 0, 7); ctx.fill(); ctx.stroke();
      animal(ANIMALS[(bonus - 1) % ANIMALS.length], bx - 90, by - 4, 120);
      text(String(bonus), bx + 90, by, 110, '#ffd700', 'left');
      text(`다음 추첨까지 ${Math.ceil(LOTTO_SUMMARY_T - game.phaseT)}초`, W / 2, 1720, 40, m.accent);
    }
  } else if (game.phase === 'result' && game.final) {
    ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 0, W, VIEW_H);
    text('🏆 우승', W / 2, 520, 90, '#ffd166');  // 이모지는 폰트가 없으면 빈칸으로 보일 수 있음
    const w = game.final[0];
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = w.color; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(W / 2, 700, 120, 0, 7); ctx.fill(); ctx.stroke();
    animal(w.emoji, W / 2, 705, 200);
    text(`#${w.id} ${w.name || ''}`.trim(), W / 2, 860, 80, '#fff');
    game.final.slice(1, 5).forEach((b, i) => {
      const y = 1010 + i * 90;
      animal(b.emoji, W / 2 - 250, y, 56);
      const lbl = `${i + 2}위  #${b.id} ${b.name || ''}${b.finished ? '' : ' (미도착)'}`.trim();
      text(lbl, W / 2 - 160, y, 46, '#fff', 'left');
    });
    const left = Math.ceil(RESULT_T - game.phaseT);
    text(`다음 라운드까지 ${left}초`, W / 2, 1530, 44, m.accent);
  }

  if (game.lotto && game.phase !== 'summary') drawTray(game, m);

  for (const c of game.confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c;
    ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore();
  }
}

function render(game) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawWorld(game);
  drawHUD(game);
}

/* ---------------- 시작 ---------------- */
const game = new Game(loadSettings());
let last = performance.now();
function frame(now) {
  game.update((now - last) / 1000); last = now;
  render(game);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 설정 패널 ---------------- */
const $ = id => document.getElementById(id);
$('names').value = game.settings.names.join('\n');
$('count').value = game.settings.count;
$('lotto').checked = game.settings.lotto;
$('gear').onclick = () => $('panel').classList.toggle('open');
// 녹화 시 화면에 안 보이도록 버튼은 몇 초 뒤 숨김 (화면을 터치하면 다시 나타남)
let gearTimer;
function wakeGear() {
  $('ctrls').classList.remove('idle'); clearTimeout(gearTimer);
  gearTimer = setTimeout(() => { if (!$('panel').classList.contains('open')) $('ctrls').classList.add('idle'); }, 3000);
}
['pointerdown', 'pointermove', 'keydown'].forEach(ev => addEventListener(ev, wakeGear));
// 소리: 브라우저 정책상 첫 터치 이후에 켜짐. 🔊/🔇 버튼으로 끄고 켤 수 있음
try { Sfx.enabled = localStorage.getItem('marble.sound') !== '0'; } catch (e) { }
function syncSnd() { $('snd').textContent = Sfx.enabled && Sfx.on ? '🔊' : '🔇'; }
try { Music.enabled = localStorage.getItem('marble.music') !== '0'; } catch (e) { }
function syncMus() { $('mus').textContent = Music.enabled && Sfx.enabled ? '🎵' : '🔕'; }
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { Sfx.unlock(); Music.start(); }));
// 🔊 = 모든 소리(효과음+음악), 🎵 = 배경음악만
$('snd').onclick = () => {
  Sfx.unlock(); Sfx.enabled = !Sfx.enabled;
  try { localStorage.setItem('marble.sound', Sfx.enabled ? '1' : '0'); } catch (e) { }
  if (Sfx.enabled) { Music.start(); Sfx.tick(1); } else Music.stop();
  syncSnd(); syncMus(); toast(Sfx.enabled ? '소리 켜짐' : '모든 소리 꺼짐');
};
$('mus').onclick = () => {
  Sfx.unlock(); Music.enabled = !Music.enabled;
  try { localStorage.setItem('marble.music', Music.enabled ? '1' : '0'); } catch (e) { }
  if (Music.enabled) Music.start(); else Music.stop();
  syncMus(); toast(Music.enabled ? '배경음악 켜짐' : '배경음악 꺼짐');
};
setInterval(() => { syncSnd(); syncMus(); }, 500);

// 테스트/녹화 보조용
window.__marble = { Sim, MAPS, makeMap, mulberry32, game, STEP, Sfx, Music };
</script>
</body>
</html>
